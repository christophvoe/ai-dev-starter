[project]
name = "ai-dev-starter"
version = "0.1.0"
description = "Blueprint template for AI-assisted Python development"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Christoph Voeltzke" }]

dependencies = [
    # AI / LLM
    "anthropic>=0.49.0",
    "openai>=1.0.0",
    # Environment & Config
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    # HTTP / Scraping
    "requests>=2.31.0",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "curl-cffi>=0.14.0",
    # Output / CLI
    "rich>=13.0.0",
]

[project.optional-dependencies]
# Uncomment in dependencies or install via: uv sync --extra frameworks
frameworks = [
    # "pydantic-ai>=0.1.0",
    # "langgraph>=0.2.0",
    # "crewai>=0.80.0",
]
telegram = [
    "python-telegram-bot>=21.0",
]

[dependency-groups]
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    # Linting & Formatting
    "ruff>=0.11.0",
    # Type Checking
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
    "types-beautifulsoup4>=4.12.0",
    # Pre-commit
    "pre-commit>=4.0.0",
]

# ── Build system ──────────────────────────────────────────────────────────────
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── Ruff (linting + formatting) ──────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade (modern Python syntax)
    "B",    # flake8-bugbear (common bugs)
    "SIM",  # flake8-simplify
    "T20",  # flake8-print (no stray prints)
    "RUF",  # ruff-specific rules
]
ignore = [
    "T201",   # allow print() in CLI tools
    "E501",   # line length handled by formatter
    "B008",   # function calls in default args (common in FastAPI/Click patterns)
]

[tool.ruff.lint.isort]
known-first-party = ["agents", "knowledge", "bot", "utils"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]        # allow print in tests
"src/main.py" = ["T20"]    # allow print in entry point

# ── Mypy (type checking) ─────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false          # too strict for a starter template
check_untyped_defs = true
ignore_missing_imports = true          # many deps lack stubs

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "knowledge.medium_scraper"
# BeautifulSoup's Tag|NavigableString unions and feedparser's dynamic types
# create many false positives; suppress the noisy categories
disable_error_code = ["union-attr", "assignment", "no-any-return", "attr-defined"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
asyncio_mode = "strict"

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit = ["src/__init__.py", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ ==",
    "if TYPE_CHECKING:",
]
